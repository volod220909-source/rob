<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Мій чат</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#eef2ff;color:#172033}
  .wrap{max-width:680px;margin:0 auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column;gap:12px}
  header{background:#172554;color:white;padding:18px;border-radius:18px}
  h1{font-size:22px;margin:0 0 4px} .sub{opacity:.8;font-size:13px}
  .panel{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 12px #17255412}
  label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}
  input,button,textarea{font:inherit;border-radius:11px;padding:12px;border:1px solid #cbd5e1}
  input,textarea{width:100%;background:white;color:#172033}
  textarea{min-height:90px;resize:vertical}
  button{border:0;background:#1d4ed8;color:white;font-weight:650;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px}.row input{min-width:0;flex:1}
  #status{font-size:13px;color:#475569;margin-top:8px}
  #messages{flex:1;min-height:220px;max-height:55dvh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px}
  .msg{max-width:85%;background:#e2e8f0;border-radius:14px;padding:9px 12px;overflow-wrap:anywhere}
  .msg.mine{align-self:flex-end;background:#dbeafe}
  .meta{font-size:11px;color:#64748b;margin-bottom:3px}
  #chatPanel{display:none;flex:1;flex-direction:column;gap:10px}
  .hint{font-size:12px;color:#64748b;line-height:1.45}
  .error{color:#b91c1c!important}

  .menu-title{font-size:19px;margin:0 0 4px}
  .menu-box{display:flex;flex-direction:column;gap:9px}
  .menu-box + .menu-box{margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0}
  .result{background:#e2e8f0;padding:12px;border-radius:10px;min-height:55px;overflow-wrap:anywhere;white-space:pre-wrap}
  .result.error{background:#fee2e2}
  .btn-gray{background:#475569}
  .btn-green{background:#15803d}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Мій чат</h1><div class="sub">Приватна кімната за кодом · 🔒 повідомлення шифруються автоматично</div></header>

  <section class="panel" id="setup">
    <label for="name">Твоє ім'я</label><input id="name" maxlength="24" placeholder="Наприклад, Андрій">
    <label for="room">Код кімнати</label><input id="room" maxlength="32" placeholder="Наприклад, 4821" autocomplete="off">
    <div class="row" style="margin-top:12px">
      <button id="join" style="flex:1">Увійти в чат</button>
      <button id="newRoom" style="background:#475569">Новий код</button>
    </div>
    <div id="status">Для роботи потрібен інтернет і налаштований Firebase.</div>
  </section>

  <section class="panel" id="chatPanel">
    <div class="row" style="align-items:center;justify-content:space-between">
      <strong id="roomTitle">Кімната</strong><button id="leave" style="background:#64748b;padding:8px 12px">Вийти</button>
    </div>
    <div id="messages"></div>
    <div class="row">
      <input id="message" maxlength="1000" placeholder="Напиши повідомлення..." autocomplete="off">
      <button id="send">Надіслати</button>
    </div>
    <div class="hint">🔒 Повідомлення шифруються перед
