<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Шифрувальник</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#eef2ff;color:#172033}
  .wrap{max-width:680px;margin:0 auto;min-height:100dvh;padding:16px;display:flex;flex-direction:column;gap:12px}
  header{background:#172554;color:white;padding:18px;border-radius:18px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{opacity:.8;font-size:13px}
  .panel{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 12px #17255412}
  .box{display:flex;flex-direction:column;gap:9px}
  .box + .box{margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0}
  textarea,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #cbd5e1;width:100%}
  textarea{min-height:100px;resize:vertical;background:white;color:#172033}
  button{border:0;background:#1d4ed8;color:white;font-weight:650;cursor:pointer}
  .btn-green{background:#15803d}
  .btn-gray{background:#475569}
  .result{background:#e2e8f0;padding:12px;border-radius:10px;min-height:55px;overflow-wrap:anywhere;white-space:pre-wrap}
  .result.error{background:#fee2e2;color:#b91c1c}
  .hint{font-size:12px;color:#64748b;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔐 Шифрувальник</h1>
    <div class="sub">Кожен символ зсувається на 3 за своїм кодом</div>
  </header>

  <section class="panel">
    <div class="box">
      <strong>🔒 Шифрування</strong>
      <textarea id="encIn" placeholder="Введи секретне повідомлення..."></textarea>
      <button id="encBtn">Зашифрувати</button>
      <div class="result" id="encOut"></div>
      <button id="encCopy" class="btn-gray">Копіювати зашифрований код</button>
    </div>

    <div class="box">
      <strong>🔓 Дешифрування</strong>
      <textarea id="decIn" placeholder="Встав сюди зашифрований код..."></textarea>
      <button id="decBtn" class="btn-green">Розшифрувати</button>
      <div class="result" id="decOut"></div>
      <button id="decCopy" class="btn-gray">Копіювати розшифроване</button>
    </div>
  </section>

  <section class="panel hint">
    Це навчальний шифр: він легко зламується і не замінює справжнього захисту даних.
    Зашифрований текст може містити дивні символи, тому передавай його кнопкою «Копіювати».
  </section>
</div>

<script>
(function () {
  var SHIFT = 3; // кількість кроків змішування
  var $ = function (id) { return document.getElementById(id); };

  // аналог Python: chr(ord(char) + shift)
  function shiftText(text, shift) {
    var result = "";
    for (var ch of text) {
      result += String.fromCodePoint(ch.codePointAt(0) + shift);
    }
    return result;
  }

  function show(outId, shift, input) {
    var out = $(outId);
    if (!input.trim()) {
      out.textContent = "Спочатку введи текст.";
      out.classList.add("error");
      return;
    }
    try {
      out.textContent = shiftText(input, shift);
      out.classList.remove("error");
    } catch (e) {
      out.textContent = "Не вдалося обробити цей текст.";
      out.classList.add("error");
    }
  }

  function copy(outId, btn) {
    var out = $(outId);
    var t = out.textContent, old = btn.textContent;
    if (!t || out.classList.contains("error")) return;
    function done() {
      btn.textContent = "Скопійовано ✓";
      setTimeout(function () { btn.textContent = old; }, 1400);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove(); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, fallback);
    } else fallback();
  }

  $("encBtn").onclick = function () { show("encOut", SHIFT, $("encIn").value); };
  $("decBtn").onclick = function () { show("decOut", -SHIFT, $("decIn").value); };
  $("encCopy").onclick = function () { copy("encOut", this); };
  $("decCopy").onclick = function () { copy("decOut", this); };
})();
</script>
</body>
</html>
